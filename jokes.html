<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f3">
  <meta name="description" content="Generator lelucon acak dari API publik.">
  <title>Joke Break — nihongo.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#282522; --muted:#77716b; --accent:#d95745; --cream:#fff9f3; --line:#eee5dc; --white:#fff; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { min-height:100vh; margin:0; display:flex; flex-direction:column; color:var(--ink); background:var(--cream); font:16px/1.6 "DM Sans",sans-serif; }
    .topbar { position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line); background:rgba(255,249,243,.94); backdrop-filter:blur(12px); }
    .wrap { width:min(1040px,calc(100% - 32px)); margin-inline:auto; }
    .nav { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; color:var(--ink); text-decoration:none; font-size:19px; font-weight:800; }
    .brandmark { display:grid; place-items:center; width:34px; height:34px; margin-right:8px; border-radius:10px; color:white; background:var(--accent); font:18px "Noto Serif JP",serif; }
    .back { color:var(--ink); text-decoration:none; font-weight:700; }
    main { flex:1; display:grid; place-items:center; padding-block:56px; }
    .card { width:min(680px,100%); padding:clamp(24px,6vw,52px); border:1px solid var(--line); border-radius:28px; background:var(--white); box-shadow:0 18px 50px #49372b10; text-align:center; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.15em; }
    h1 { margin:8px 0 0; font-size:clamp(34px,7vw,54px); line-height:1.12; letter-spacing:-.04em; }
    .intro { margin:12px auto 28px; max-width:440px; color:var(--muted); }
    .joke-box { min-height:180px; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:24px; border-radius:20px; background:#fff5ee; }
    .joke-text { margin:0; font-size:clamp(19px,3vw,25px); font-weight:700; line-height:1.55; }
    .punchline { color:var(--accent); }
    .category { align-self:center; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:12px; text-transform:capitalize; }
    .status { min-height:24px; margin:12px 0 0; color:var(--muted); font-size:13px; }
    .status.error { color:#b42318; }
    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:20px; }
    button { min-height:46px; padding:11px 18px; border:1px solid var(--line); border-radius:13px; background:white; color:var(--ink); font:inherit; font-weight:800; cursor:pointer; transition:transform .18s,background .18s; }
    button:hover:not(:disabled) { transform:translateY(-2px); }
    button:focus-visible, a:focus-visible { outline:3px solid #d9574570; outline-offset:3px; }
    button:disabled { opacity:.6; cursor:wait; }
    .primary { border-color:var(--accent); background:var(--accent); color:white; }
    .footer { padding:20px 0; border-top:1px solid var(--line); color:var(--muted); font-size:13px; text-align:center; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" href="index.html"><span class="brandmark" aria-hidden="true">あ</span>nihongo.</a>
      <a class="back" href="index.html">← Kembali ke materi</a>
    </div>
  </header>
  <main class="wrap">
    <section class="card" aria-labelledby="title">
      <div class="eyebrow">JOKE BREAK · 笑い</div>
      <h1 id="title">Butuh jeda? 😄</h1>
      <p class="intro">Ambil napas sebentar dan nikmati lelucon acak dari internet.</p>
      <div class="joke-box" aria-live="polite" aria-busy="false">
        <p class="joke-text" id="setup">Tekan tombol untuk mengambil lelucon.</p>
        <p class="joke-text punchline" id="punchline" hidden></p>
        <span class="category" id="category" hidden></span>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="actions">
        <button class="primary" id="newJoke" type="button">🎲 Lelucon berikutnya</button>
        <button id="copyJoke" type="button" disabled>Salin lelucon</button>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="wrap">Joke break kecil di sela-sela belajar. 頑張って！</div></footer>
  <script>
    (() => {
      const endpoint = 'https://official-joke-api.appspot.com/random_joke';
      const box = document.querySelector('.joke-box');
      const setup = document.getElementById('setup');
      const punchline = document.getElementById('punchline');
      const category = document.getElementById('category');
      const status = document.getElementById('status');
      const newButton = document.getElementById('newJoke');
      const copyButton = document.getElementById('copyJoke');
      let currentJoke = '';

      async function getJoke() {
        newButton.disabled = true;
        copyButton.disabled = true;
        box.setAttribute('aria-busy', 'true');
        status.classList.remove('error');
        status.textContent = 'Sedang mencari lelucon…';
        setup.textContent = 'Sebentar ya…';
        punchline.hidden = true;
        category.hidden = true;
        try {
          const response = await fetch(endpoint, { headers: { Accept: 'application/json' }, cache: 'no-store' });
          if (!response.ok) throw new Error('API mengembalikan respons yang tidak berhasil.');
          const joke = await response.json();
          if (typeof joke.setup !== 'string' || typeof joke.punchline !== 'string') throw new Error('Format lelucon tidak dikenali.');
          setup.textContent = joke.setup;
          punchline.textContent = joke.punchline;
          punchline.hidden = false;
          if (typeof joke.type === 'string') {
            category.textContent = joke.type;
            category.hidden = false;
          }
          currentJoke = `${joke.setup}\n${joke.punchline}`;
          copyButton.disabled = false;
          status.textContent = 'Lelucon baru siap!';
        } catch (error) {
          setup.textContent = 'Leluconnya belum berhasil dimuat.';
          status.textContent = 'Periksa koneksi internet, lalu coba lagi.';
          status.classList.add('error');
          console.error('Gagal mengambil lelucon:', error);
        } finally {
          newButton.disabled = false;
          box.setAttribute('aria-busy', 'false');
        }
      }

      newButton.addEventListener('click', getJoke);
      copyButton.addEventListener('click', async () => {
        if (!currentJoke) return;
        try {
          await navigator.clipboard.writeText(currentJoke);
          status.textContent = 'Lelucon berhasil disalin.';
        } catch {
          status.textContent = 'Tidak dapat menyalin otomatis di browser ini.';
        }
      });
      getJoke();
    })();
  </script>
</body>
</html>
